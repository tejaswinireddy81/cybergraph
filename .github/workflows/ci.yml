name: CyberGraph CI Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit flake8

    - name: Static Security Analysis (Bandit)
      run: |
        bandit -r modules response -ll -ii

    - name: Code Quality & Lint (Flake8)
      run: |
        flake8 modules response --count --max-line-length=127 --statistics || true

    - name: Run Pytest suite
      run: |
        pytest tests/ -v
