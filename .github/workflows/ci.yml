name: CyberGraph CI

# Fresh GitHub runners have NO trained models, dataset or local secrets (all gitignored), and CI
# never retrains them. Tests are therefore split explicitly (see latest/tests/conftest.py):
#   * unmarked tests      -> web layer, auth/CSRF, firewall safety, dashboard JS ... run here
#   * @requires_models    -> need real trained models; reported as SKIPPED with a reason
# Full model-dependent coverage runs on a developer machine after `python scripts/setup_pipeline.py`.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: latest/requirements.txt

    - name: Set up Node (dashboard JS syntax check)
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install dependencies (CPU-only)
      run: |
        python -m pip install --upgrade pip
        # PyTorch CPU wheels: the default Linux wheel drags in ~3 GB of CUDA libraries.
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        # TensorFlow is imported only by the training/evaluation scripts, never by the app or the
        # tests, so CI skips it. torch is already installed above.
        grep -v -E '^(tensorflow-cpu|torch)[<>=!~ ]' requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
        pip install -r "$RUNNER_TEMP/requirements-ci.txt"
        pip install bandit flake8 pip-audit

    - name: Dependency vulnerability audit (pip-audit)
      # Audits what was actually installed. The local-version CPU torch wheel is not on PyPI, so
      # pip-audit reports it as "could not be audited" (a notice, not a failure).
      run: |
        pip-audit --desc --local

    - name: Static security analysis (Bandit, medium+ severity/confidence)
      run: |
        bandit -r routes modules response config evaluation scripts/experiments -ll -ii

    - name: Lint - correctness gate (blocking)
      # Syntax errors, undefined names, invalid comparisons.
      run: |
        flake8 routes modules response config evaluation scripts/experiments --select=E9,F63,F7,F82 --count --show-source --statistics

    - name: Lint - style report (informational, never blocks)
      run: |
        flake8 routes modules response config evaluation scripts/experiments --max-line-length=127 --extend-ignore=E203,W503 --statistics --exit-zero

    - name: Dashboard JS syntax check
      run: |
        node --check static/js/app.js

    - name: Run pytest (model-dependent tests are skipped with a reason)
      run: |
        pytest tests/ -v -rs
